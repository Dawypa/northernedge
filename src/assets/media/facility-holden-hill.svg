<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <rect width="1200" height="600" fill="#0B0E14" />
  <!-- Architectural Blueprint & Zone Floorplan of Holden Hill Facility -->
  <rect x="48" y="72" width="1104" height="456" rx="10" fill="#111722" stroke="#1E293B" stroke-width="2" />

  <!-- Zone 1: 30m Indoor Mondo Sprint & Kicking Turf Lane (Top Half) -->
  <rect x="76" y="98" width="1048" height="190" rx="6" fill="#0C221A" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5" />
  <g stroke="#34D399" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="250" y1="98" x2="250" y2="288" />
    <line x1="425" y1="98" x2="425" y2="288" />
    <line x1="600" y1="98" x2="600" y2="288" />
    <line x1="775" y1="98" x2="775" y2="288" />
    <line x1="950" y1="98" x2="950" y2="288" />
  </g>
  <line x1="100" y1="193" x2="1080" y2="193" stroke="#FF5500" stroke-width="3" />
  <circle cx="1080" cy="193" r="14" fill="#FF5500" fill-opacity="0.3" stroke="#FF5500" stroke-width="2" />
  <text x="100" y="130" fill="#F8FAFC" font-family="sans-serif" font-weight="700" font-size="18">ZONE A · 30M INDOOR MONDO SPRINT TURF &amp; RADAR KICKING NET BAY</text>
  <text x="100" y="268" fill="#94A3B8" font-family="monospace" font-size="13">TIMING GATES @ 5M / 10M / 20M / 30M · HIGH-SPEED 240FPS DUAL CAMERAS</text>

  <!-- Zone 2: 6 Custom S&C Combo Racks (Bottom Left) -->
  <rect x="76" y="310" width="660" height="192" rx="6" fill="#151D2A" stroke="#2563EB" stroke-opacity="0.45" stroke-width="1.5" />
  <text x="100" y="342" fill="#F8FAFC" font-family="sans-serif" font-weight="700" font-size="18">ZONE B · 6x HEAVY STRENGTH &amp; BALLISTIC POWER BAYS</text>
  <!-- 6 Racks -->
  <g fill="#1E293B" stroke="#3B82F6" stroke-width="1.5">
    <rect x="100" y="365" width="88" height="96" rx="4" />
    <rect x="204" y="365" width="88" height="96" rx="4" />
    <rect x="308" y="365" width="88" height="96" rx="4" />
    <rect x="412" y="365" width="88" height="96" rx="4" />
    <rect x="516" y="365" width="88" height="96" rx="4" />
    <rect x="620" y="365" width="88" height="96" rx="4" />
  </g>
  <text x="100" y="485" fill="#94A3B8" font-family="monospace" font-size="12">ELEIKO COMPETITION PLATES · GYMAWARE VBT TETHERS · SOLEUS SEATED ISO RIGS</text>

  <!-- Zone 3: Force Decks & Recovery Diagnostics Lab (Bottom Right) -->
  <rect x="756" y="310" width="368" height="192" rx="6" fill="#151D2A" stroke="#FF5500" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="780" y="342" fill="#F8FAFC" font-family="sans-serif" font-weight="700" font-size="18">ZONE C · BIOMECH TESTING &amp; ERG DECK</text>
  <rect x="780" y="365" width="145" height="96" rx="4" fill="#1E293B" stroke="#FF5500" stroke-width="1.5" />
  <rect x="945" y="365" width="155" height="96" rx="4" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5" />
  <text x="795" y="418" fill="#F8FAFC" font-family="monospace" font-size="12">DUAL FORCE PLATES</text>
  <text x="962" y="418" fill="#F8FAFC" font-family="monospace" font-size="12">NORDIC &amp; GROIN LAB</text>
  <text x="780" y="485" fill="#94A3B8" font-family="monospace" font-size="12">UNIT 4, 560 NORTH EAST RD, HOLDEN HILL SA 5088</text>
