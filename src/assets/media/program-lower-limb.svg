  <text x="64" y="56" fill="#F8FAFC" font-family="sans-serif" font-weight="700" font-size="22">2.3 BULLETPROOF LOWER-LIMB · CALF &amp; HAMSTRING RESILIENCE</text>
  <text x="64" y="545" fill="#94A3B8" font-family="monospace" font-size="14">HIGH-SPEED RUNNING EXPOSURE · SOLEUS CAPACITY · ECCENTRIC BICEPS FEMORIS</text>
